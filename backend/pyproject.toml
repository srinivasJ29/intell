[project]
name = "intelliresearch-backend"
version = "1.0.0"
description = "IntelliResearch AI multi-document research backend engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.32",
    "alembic>=1.13.2",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "argon2-cffi>=23.1.0",
    "pyjwt[crypto]>=2.9.0",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24.9",
    "chromadb>=0.5.5",
    "sentence-transformers>=3.0.1",
    "rank_bm25>=0.2.2",
    "langchain>=0.2.14",
    "langgraph>=0.2.16",
    "openai>=1.42.0",
    "redis>=5.0.8",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

